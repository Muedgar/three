<!doctype html><html><head><meta charset="UTF-8"><title>Rain</title><style>body{margin:0;overflow:hidden}</style></head><body><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x07101c);scene.fog=new THREE.Fog(0x07101c,8,20);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.z=10;const renderer=new THREE.WebGLRenderer();renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const count=1200,pos=new Float32Array(count*6),speed=[];for(let i=0;i<count;i++){const x=(Math.random()-.5)*18,y=(Math.random()-.5)*14,z=(Math.random()-.5)*12;pos[i*6]=x;pos[i*6+1]=y;pos[i*6+2]=z;pos[i*6+3]=x;pos[i*6+4]=y-.3;pos[i*6+5]=z;speed[i]=.08+Math.random()*.14}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));const rain=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x60a5fa,transparent:true,opacity:.65}));scene.add(rain);
function animate(){requestAnimationFrame(animate);for(let i=0;i<count;i++){pos[i*6+1]-=speed[i];pos[i*6+4]-=speed[i];if(pos[i*6+1]<-7){pos[i*6+1]=7;pos[i*6+4]=6.7}}g.attributes.position.needsUpdate=true;renderer.render(scene,camera)}animate();
</script></body></html>
