<!doctype html><html><head><meta charset="UTF-8"><title>Drawing Lines</title><style>body{margin:0;overflow:hidden}</style></head><body><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07111f);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.z=7;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const points=[];for(let i=0;i<100;i++){const x=(i/99)*8-4;points.push(new THREE.Vector3(x,Math.sin(x*2),0))}const geometry=new THREE.BufferGeometry().setFromPoints(points);const line=new THREE.Line(geometry,new THREE.LineBasicMaterial({color:0x22d3ee}));scene.add(line);
function animate(){requestAnimationFrame(animate);line.rotation.z+=.003;renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
