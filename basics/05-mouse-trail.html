<!doctype html><html><head><meta charset="UTF-8"><title>Mouse Trail</title><style>body{margin:0;overflow:hidden}</style></head><body><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050816);const camera=new THREE.OrthographicCamera(-5,5,3,-3,.1,10);camera.position.z=5;const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const count=45,positions=new Float32Array(count*3);const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));const trail=new THREE.Line(geometry,new THREE.LineBasicMaterial({color:0xa78bfa}));scene.add(trail);const mouse=new THREE.Vector3();
addEventListener('pointermove',e=>{mouse.x=(e.clientX/innerWidth*2-1)*5;mouse.y=-(e.clientY/innerHeight*2-1)*3});
function animate(){requestAnimationFrame(animate);for(let i=count-1;i>0;i--){positions[i*3]=positions[(i-1)*3];positions[i*3+1]=positions[(i-1)*3+1]}positions[0]+=(mouse.x-positions[0])*.25;positions[1]+=(mouse.y-positions[1])*.25;geometry.attributes.position.needsUpdate=true;renderer.render(scene,camera)}animate();addEventListener('resize',()=>renderer.setSize(innerWidth,innerHeight));
</script></body></html>
