<!doctype html><html><head><meta charset="UTF-8"><title>Star Field</title><style>body{margin:0;overflow:hidden}</style></head><body><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x000005);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);camera.position.z=5;const renderer=new THREE.WebGLRenderer();renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const count=2500,pos=new Float32Array(count*3);function reset(i,far=false){pos[i*3]=(Math.random()-.5)*30;pos[i*3+1]=(Math.random()-.5)*20;pos[i*3+2]=far?-50:Math.random()*-55+5}for(let i=0;i<count;i++)reset(i);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.06,sizeAttenuation:true})));
function animate(){requestAnimationFrame(animate);for(let i=0;i<count;i++){pos[i*3+2]+=.12;if(pos[i*3+2]>5)reset(i,true)}g.attributes.position.needsUpdate=true;renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
