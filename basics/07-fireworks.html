<!doctype html><html><head><meta charset="UTF-8"><title>Fireworks</title><style>body{margin:0;overflow:hidden}p{position:fixed;color:white;font:16px system-ui;left:20px}</style></head><body><p>Click anywhere to launch a firework</p><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x02040c);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.z=10;const renderer=new THREE.WebGLRenderer();renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const fireworks=[];
function launch(x=0,y=0){const count=180,pos=new Float32Array(count*3),vel=[];for(let i=0;i<count;i++){pos[i*3]=x;pos[i*3+1]=y;const a=Math.random()*Math.PI*2,s=1+Math.random()*4;vel.push(new THREE.Vector3(Math.cos(a)*s,Math.sin(a)*s,(Math.random()-.5)*2))}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));const p=new THREE.Points(g,new THREE.PointsMaterial({color:new THREE.Color().setHSL(Math.random(),1,.65),size:.07,transparent:true}));scene.add(p);fireworks.push({p,vel,life:1})}
addEventListener('pointerdown',e=>launch((e.clientX/innerWidth*2-1)*5,-(e.clientY/innerHeight*2-1)*3));let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.03);last=now;for(let f=fireworks.length-1;f>=0;f--){const o=fireworks[f],a=o.p.geometry.attributes.position.array;o.life-=dt*.55;for(let i=0;i<o.vel.length;i++){o.vel[i].y-=2*dt;a[i*3]+=o.vel[i].x*dt;a[i*3+1]+=o.vel[i].y*dt;a[i*3+2]+=o.vel[i].z*dt}o.p.geometry.attributes.position.needsUpdate=true;o.p.material.opacity=o.life;if(o.life<=0){scene.remove(o.p);fireworks.splice(f,1)}}renderer.render(scene,camera)}requestAnimationFrame(animate);
</script></body></html>
