<!doctype html><html><head><meta charset="UTF-8"><title>Particle System</title><style>body{margin:0;overflow:hidden}</style></head><body><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x030712);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.z=8;const renderer=new THREE.WebGLRenderer();renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const count=1500,positions=new Float32Array(count*3),speeds=new Float32Array(count);for(let i=0;i<count;i++){positions[i*3]=(Math.random()-.5)*10;positions[i*3+1]=(Math.random()-.5)*7;positions[i*3+2]=(Math.random()-.5)*6;speeds[i]=.005+Math.random()*.02}const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));const particles=new THREE.Points(geometry,new THREE.PointsMaterial({color:0x67e8f9,size:.045}));scene.add(particles);
function animate(){requestAnimationFrame(animate);for(let i=0;i<count;i++){positions[i*3+1]+=speeds[i];if(positions[i*3+1]>3.5)positions[i*3+1]=-3.5}geometry.attributes.position.needsUpdate=true;particles.rotation.y+=.001;renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
