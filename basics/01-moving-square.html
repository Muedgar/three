<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Moving Square</title>
        <style>body{margin:0;overflow:hidden}</style>
        </head><body>
            <script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene(); 
scene.background=new THREE.Color(0x07111f);
const camera=new THREE.OrthographicCamera(-5,5,3,-3,.1,100); 
camera.position.z=10;
const renderer=new THREE.WebGLRenderer({antialias:true}); 
renderer.setSize(innerWidth,innerHeight); 
document.body.appendChild(renderer.domElement);
const square=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.5), new THREE.MeshBasicMaterial({color:0x38bdf8})); 
scene.add(square);
const clock=new THREE.Clock();
function animate(){
    requestAnimationFrame(animate);
    const t=clock.getElapsedTime();
    square.position.x=Math.sin(t)*3.5;
    square.rotation.z=t;
    renderer.render(scene,camera)
} 
animate();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
