<!doctype html><html><head><meta charset="UTF-8"><title>Drawing Circles</title><style>body{margin:0;overflow:hidden}</style></head><body><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x100b20);const camera=new THREE.OrthographicCamera(-5,5,3,-3,.1,100);camera.position.z=10;const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
for(let r=.5;r<=2.5;r+=.5){const curve=new THREE.EllipseCurve(0,0,r,r,0,Math.PI*2);const points=curve.getPoints(80).map(p=>new THREE.Vector3(p.x,p.y,0));const circle=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color:new THREE.Color().setHSL(r/3,1,.65)}));scene.add(circle)}
function animate(t){requestAnimationFrame(animate);scene.rotation.z=t*.0002;renderer.render(scene,camera)}animate();addEventListener('resize',()=>renderer.setSize(innerWidth,innerHeight));
</script></body></html>
