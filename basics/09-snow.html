<!doctype html><html><head><meta charset="UTF-8"><title>Snow</title><style>body{margin:0;overflow:hidden}</style></head><body><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x10213b);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.z=10;const renderer=new THREE.WebGLRenderer();renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const count=1000,pos=new Float32Array(count*3),phase=new Float32Array(count);for(let i=0;i<count;i++){pos[i*3]=(Math.random()-.5)*16;pos[i*3+1]=(Math.random()-.5)*12;pos[i*3+2]=(Math.random()-.5)*8;phase[i]=Math.random()*6}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.09,transparent:true,opacity:.85})));
function animate(t){requestAnimationFrame(animate);for(let i=0;i<count;i++){pos[i*3]+=Math.sin(t*.001+phase[i])*.003;pos[i*3+1]-=.012;if(pos[i*3+1]<-6)pos[i*3+1]=6}g.attributes.position.needsUpdate=true;renderer.render(scene,camera)}animate();
</script></body></html>
