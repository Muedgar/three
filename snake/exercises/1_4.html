<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Three.js Box</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";

        // 1. Create the scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color("#9ee7ff");

        // 2. Create the camera
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(7, 4.5, 8);
        camera.lookAt(0, 0.5, 0);

        // 3. Create the renderer
        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;

        document.body.appendChild(renderer.domElement);

        // 4. Add lighting
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(5, 10, 8);
        sun.castShadow = true;
        scene.add(sun);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // 5. Create the box geometry
        const boxGeometry = new THREE.BoxGeometry(1, 1, 1);

        // 6. Create the box material
        const boxMaterial = new THREE.MeshStandardMaterial({
            color: "#ff6b35"
        });

        // 7. Combine geometry and material into a mesh
        const box = new THREE.Mesh(boxGeometry, boxMaterial);
        box.castShadow = true;
        scene.add(box);

        // 8. Create the ground
        const groundGeometry = new THREE.PlaneGeometry(20, 20);

        const groundMaterial = new THREE.MeshStandardMaterial({
            color: "#39a845"
        });

        const ground = new THREE.Mesh(
            groundGeometry,
            groundMaterial
        );

        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;

        scene.add(ground);

        // 9. Animation loop
        function animate() {
            requestAnimationFrame(animate);

            box.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        animate();

        // 10. Handle browser resizing
        window.addEventListener("resize", () => {
            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        });
    </script>
</body>
</html>
